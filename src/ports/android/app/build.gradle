// KlipperScreen-esp Android 应用模块。
// 原生代码由 app/jni/CMakeLists.txt 构建（libmain.so + libSDL2.so）；
// SDLActivity 胶水层 Java 源码不入库，构建前由 tools/fetch-android-deps.sh
// 从 SDL2 源码树拷入 app/src/main/java/org/libsdl/app/。
apply plugin: 'com.android.application'

// 版本号与固件/桌面端同源：src/core/version.h 的 KR_VERSION
// （rootDir = src/ports/android，要上三级才到仓库根）
// 解析全用字面字符串操作（tokenize/replace），不用正则——正则写法在 CI 上
// 神秘失配过（exists=true、内容正确、find()=false），不再给它机会。
def versionHeader = new File(rootDir, '../../../src/core/version.h')
def verName = '0.0.0'
def verCode = 1
versionHeader.eachLine('UTF-8') { line ->
    def p = line.trim().tokenize()
    if (p.size() == 3 && p[0] == '#define' && p[1] == 'KR_VERSION') {
        def nums = p[2].replace('"', '').tokenize('.')
        if (nums.size() == 3) {
            verName = "${nums[0]}.${nums[1]}.${nums[2]}"
            verCode = (nums[0] as int) * 10000 + (nums[1] as int) * 100 + (nums[2] as int)
        }
    }
}
println "KlipperScreen-esp version: ${verName} (${verCode}) <- ${versionHeader.absolutePath} [exists=${versionHeader.exists()}]"
if (versionHeader.exists()) {
    println "version.h head: ${versionHeader.text.take(200).replace('\n', ' | ')}"
} else {
    println "parent listing: ${versionHeader.parentFile.exists() ? versionHeader.parentFile.list()?.take(20) : 'NO PARENT DIR'}"
}
if (verName == '0.0.0') {
    // 静默 0.0.0 包绝不能出厂（曾经因为路径少一级全部 APK 都是 0.0.0/1）
    throw new GradleException("version.h 未找到或未匹配: ${versionHeader.absolutePath} (rootDir=${rootDir})")
}

// SDL2 源码树（tools/fetch-android-deps.sh 拉到 third_party/SDL2，可用环境变量覆盖）
def sdl2Root = System.getenv('SDL2_ROOT') ?: new File(rootDir, '../../third_party/SDL2').absolutePath
sdl2Root = sdl2Root.replace('\\', '/')

android {
    namespace 'com.umeiko.klipperscreenesp'
    compileSdkVersion 34

    // CI 用 -PndkVersion=<已安装版本> 显式指定；不设时走 AGP 默认 NDK
    if (project.hasProperty('ndkVersion')) {
        ndkVersion project.property('ndkVersion')
    }

    defaultConfig {
        applicationId 'com.umeiko.klipperscreenesp'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode verCode
        versionName verName
        externalNativeBuild {
            cmake {
                arguments "-DSDL2_ROOT=${sdl2Root}"
                // arm64 覆盖现代设备，armeabi-v7a 覆盖旧 32 位设备；模拟器自行加 x86_64
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    signingConfigs {
        debug {
            // 固定测试密钥（入库）：CI 每次跑都是新 runner，AGP 自带的
            // debug.keystore 每次生成都不同 → 覆盖安装必报签名冲突。
            // 统一用本文件签名，测试期升级免卸载。仅用于侧载测试，
            // 正式接入 release 发版时换 secrets 里的专用密钥。
            storeFile file('../debug-test.p12')
            storeType 'PKCS12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 试用阶段：release 构建用（固定）debug 密钥签名，可直接侧载安装。
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // FileProvider（自更新装 APK 的 content:// 暴露）需要 androidx.core
    implementation 'androidx.core:core:1.13.1'
}
