[platformio]
default_envs = wio-terminal
src_dir = .

[env:wio-terminal]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.90201.0
monitor_speed = 115200
extra_scripts = pre:extra_script.py
lib_ldf_mode = deep+
lib_deps =
    https://github.com/Seeed-Studio/Seeed_Arduino_LCD/archive/0dfdd7135425be82b5bb4b4b58d74dd51ab29a59.zip
    https://github.com/lvgl/lvgl/archive/refs/tags/v9.3.0.zip
    https://github.com/Seeed-Studio/Seeed_Arduino_SFUD/archive/ab3117e3baf36f8c0790f4b989c6e83ec1e5b7e5.zip
    https://github.com/Seeed-Studio/Seeed_Arduino_rpcUnified/archive/f0570f481d6f65c2e86c147f36d2b994d7bea645.zip
    https://github.com/Seeed-Studio/Seeed_Arduino_rpcWiFi/archive/4523b1d6e268b53b512df0071c9e88948ed89217.zip
    https://github.com/Seeed-Studio/Seeed_Arduino_mbedtls/archive/59fc9f8ff70d9b772f66923040de79e7c3740f14.zip
    https://github.com/Seeed-Studio/Seeed_Arduino_FS/archive/2f1f609833e10038d656fdb083edc295ba1f8cfe.zip
build_flags =
    -std=gnu++17
    -DKR_WIO_TERMINAL=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DSEEED_WIO_TERMINAL=1
    -DARDUINO_SEEED_WIO_TERMINAL=1
    -DKR_ERPC_CLIENT_TIMEOUT_US=15000000UL
    -ffunction-sections
    -fdata-sections
    -Os
build_unflags =
    -std=gnu++11
build_src_filter =
    +<*.cpp>

; Developer-only offline environment: the dependency sources are already
; fetched by the repository's desktop/bring-up workflow.  Release and CI use
; the pinned archive URLs in wio-terminal above.
[env:wio-terminal-local]
extends = env:wio-terminal
lib_deps =
    symlink://../../../tmp/wio-lcd
    symlink://../../../third_party/lvgl
    symlink://../../../tmp/wio-sfud
    symlink://../../../tmp/wio-rpcunified
    symlink://../../../tmp/wio-rpcwifi
    symlink://../../../tmp/wio-mbedtls
    symlink://../../../tmp/wio-fs
