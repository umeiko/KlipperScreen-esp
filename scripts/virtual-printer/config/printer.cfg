# 虚拟打印机配置 —— fake_klippy.py 解析本文件生成打印机对象。
# 语法与真实 printer.cfg 一致；pin/serial 等字段仅作展示，不会被真实驱动。
# 安装时 install.sh 将 @GCODES_DIR@ 替换为运行时 gcodes 目录。

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 250
homing_speed: 10

[extruder]
step_pin: PC1
dir_pin: PC3
enable_pin: !PC7
microsteps: 16
rotation_distance: 7.5
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF5
min_temp: 0
max_temp: 275
min_extrude_temp: 170
pressure_advance: 0.05
max_power: 1.0

[heater_bed]
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF4
min_temp: 0
max_temp: 110
max_power: 1.0

[fan]
pin: PA8

[heater_fan hotend_fan]
pin: PE5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[controller_fan controller_fan]
pin: PD4
fan_speed: 0.6

[fan_generic aux_fan]
pin: PE4

[temperature_sensor chamber]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF3
min_temp: 0
max_temp: 100

[filament_switch_sensor runout]
switch_pin: !PA4
pause_on_runout: False

[probe]
pin: ^!PC6
x_offset: 0
y_offset: 0
z_offset: 0.00
speed: 5
samples: 2

[bed_mesh]
speed: 120
mesh_min: 20, 20
mesh_max: 215, 215
probe_count: 7, 7
algorithm: bicubic

[safe_z_home]
home_xy_position: 117, 117
speed: 50
z_hop: 10
z_hop_speed: 15

[virtual_sdcard]
path: @GCODES_DIR@

[display_status]

[pause_resume]

[idle_timeout]
timeout: 600

[respond]

[exclude_object]

[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0
unretract_speed: 30

[manual_probe]

[output_pin BEEPER]
pin: PC5
value: 0

# ---------------- 宏 ----------------
# 注意：fake_klippy 只支持纯 gcode 行与 {params.X|default(..)} 占位，
# 不支持完整 Jinja。保持宏简单。

[gcode_macro START_PRINT]
description: Heat, home, purge line
variable_bed_temp: 60
variable_extruder_temp: 200
gcode:
    M140 S{params.BED|default(60)}
    M104 S{params.EXTRUDER|default(200)}
    G28
    M190 S{params.BED|default(60)}
    M109 S{params.EXTRUDER|default(200)}
    G92 E0
    G1 Z2 F600
    G1 X10 Y20 F6000
    G1 Z0.28
    G1 Y70 E9.5 F1500
    G1 X10.3 Y70
    G1 Y10 E9.5 F1500
    G92 E0

[gcode_macro END_PRINT]
description: Park and cool down
gcode:
    G91
    G1 Z10 F600
    G90
    G1 X10 Y210 F6000
    M104 S0
    M140 S0
    M107
    M84

[gcode_macro PURGE]
description: Simple purge line
gcode:
    G92 E0
    G1 X10 Y20 F6000
    G1 Z0.28
    G1 Y70 E9.5 F1500
    G92 E0

[gcode_macro Z_TILT_WIZARD]
description: Demo macro with variables
variable_loops: 3
variable_msg: done
gcode:
    M118 Z tilt wizard demo

[gcode_macro LOAD_FILAMENT]
description: Heat and load filament
gcode:
    M109 S210
    G91
    G1 E30 F300
    G90

[gcode_macro UNLOAD_FILAMENT]
description: Heat and unload filament
gcode:
    M109 S210
    G91
    G1 E-35 F300
    G90

[gcode_macro FILAMENT_RUNOUT]
description: Runout handler demo
gcode:
    M118 Filament runout detected
