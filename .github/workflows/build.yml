name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 所有支持板型全量构建（矩阵）。每板型独立 build 目录与 sdkconfig（芯片不同）。
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: cyd_2432s028r      # CYD 2.8" ESP32
            target: esp32
            bdir: build
            sdkcfg: sdkconfig          # 仓库已有完整文件，免 set-target
            defs: sdkconfig.defaults;sdkconfig.defaults.cyd_2432s028r
            chip: esp32
            flash_size: 4MB
            bl_offset: 0x1000
          - board: e32r35t              # ESP32-32E 3.5" E32R35T
            target: esp32
            bdir: build-e32r35t
            sdkcfg: sdkconfig.e32r35t
            defs: sdkconfig.defaults;sdkconfig.defaults.e32r35t
            chip: esp32
            flash_size: 4MB
            bl_offset: 0x1000
          - board: esp32s3-st7789-320_240-ec11  # ESP32-S3 + 240x320 ST7789 + EC11（无触摸）
            target: esp32s3
            bdir: build-ec11-knob-minimal
            sdkcfg: sdkconfig.esp32s3-st7789-320_240-ec11
            defs: sdkconfig.defaults;sdkconfig.defaults.esp32s3-st7789-320_240-ec11
            chip: esp32s3
            flash_size: 16MB
            bl_offset: 0x0
          - board: esp32-st7735s-128_160-ec11  # ESP32 + 128x160 ST7735S + EC11（无触摸，引脚对齐 CYD）
            target: esp32
            bdir: build-ec11-knob-esp32
            sdkcfg: sdkconfig.esp32-st7735s-128_160-ec11
            defs: sdkconfig.defaults;sdkconfig.defaults.esp32-st7735s-128_160-ec11
            chip: esp32
            flash_size: 4MB
            bl_offset: 0x1000
          - board: jc8048w550         # JC8048W550 5" ESP32-S3
            target: esp32s3
            bdir: build-jc8048w550
            sdkcfg: sdkconfig.jc8048w550
            defs: sdkconfig.defaults;sdkconfig.defaults.jc8048w550
            chip: esp32s3
            flash_size: 16MB
            bl_offset: 0x0
          - board: esp32s3-JLC-SZP    # 立创实战派 ESP32-S3 2.0" ST7789 + FT6336
            target: esp32s3
            bdir: build-esp32s3-jlc-szp
            sdkcfg: sdkconfig.esp32s3-JLC-SZP
            defs: sdkconfig.defaults;sdkconfig.defaults.esp32s3-JLC-SZP
            chip: esp32s3
            flash_size: 16MB
            bl_offset: 0x0
    steps:
      - uses: actions/checkout@v4

      - name: Build ESP32 firmware (${{ matrix.board }})
        run: |
          # GH Actions 会覆盖容器 entrypoint，idf 环境需手动激活；并修复容器内 git 属主告警
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          cd src/ports/esp32
          if [ ! -f "${{ matrix.sdkcfg }}" ]; then
            idf.py -B "${{ matrix.bdir }}" -DSDKCONFIG="${{ matrix.sdkcfg }}" \
                   -DSDKCONFIG_DEFAULTS="${{ matrix.defs }}" set-target "${{ matrix.target }}"
          fi
          idf.py -B "${{ matrix.bdir }}" -DSDKCONFIG="${{ matrix.sdkcfg }}" \
                 -DSDKCONFIG_DEFAULTS="${{ matrix.defs }}" build

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bins-${{ matrix.board }}
          path: |
            src/ports/esp32/${{ matrix.bdir }}/bootloader/bootloader.bin
            src/ports/esp32/${{ matrix.bdir }}/partition_table/partition-table.bin
            src/ports/esp32/${{ matrix.bdir }}/klipper_remote_display.bin

      # 板型参数随产物走：刷机脚本读 flash.cfg 决定 chip/flash 大小/bootloader 偏移
      - name: flash.cfg
        run: |
          printf 'CHIP=%s\nFLASH_SIZE=%s\nBL_OFFSET=%s\n' \
            "${{ matrix.chip }}" "${{ matrix.flash_size }}" "${{ matrix.bl_offset }}" > flash.cfg
      - uses: actions/upload-artifact@v4
        with:
          name: flash-cfg-${{ matrix.board }}
          path: flash.cfg

  package:
    runs-on: ubuntu-latest
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: cyd_2432s028r
            suffix: ""
          - board: e32r35t
            suffix: ""
          - board: esp32s3-st7789-320_240-ec11
            suffix: ""
          - board: esp32-st7735s-128_160-ec11
            suffix: ""
          - board: jc8048w550
            suffix: ""
          - board: esp32s3-JLC-SZP
            suffix: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware-bins-${{ matrix.board }}
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: flash-cfg-${{ matrix.board }}
          path: dist

      - name: Flatten artifact layout
        # upload-artifact 保留目录层级，下载后需拍平成刷机脚本期望的平铺结构
        run: |
          mv dist/bootloader/bootloader.bin dist/
          mv dist/partition_table/partition-table.bin dist/
          rmdir dist/bootloader dist/partition_table
          ls -la dist

      - name: Download esptool (Windows standalone)
        run: |
          TAG=$(curl -s https://api.github.com/repos/espressif/esptool/releases/latest | jq -r .tag_name)
          echo "esptool $TAG"
          curl -L -o /tmp/esptool.zip "https://github.com/espressif/esptool/releases/download/${TAG}/esptool-${TAG}-windows-amd64.zip"
          unzip -o /tmp/esptool.zip -d /tmp/esptool
          find /tmp/esptool -name esptool.exe -exec cp {} dist/ \;

      - name: Add flash scripts
        run: |
          cp tools/release/flash.bat tools/release/flash.sh dist/
          chmod +x dist/flash.sh
          if [ "${{ matrix.board }}" = "esp32s3-st7789-320_240-ec11" ]; then
            cp tools/release/README-esp32s3-st7789-320_240-ec11.md dist/README.md
            cp docs/hardware/ec11_knob_minimal.fzz dist/
            cp docs/screenshots/boards/ec11_knob_minimal_breadboard.zh.png dist/
            cp docs/screenshots/boards/ec11_knob_minimal_breadboard.en.png dist/
          fi

      # 直接把 dist 内容作为 artifact：GitHub 下载时会打一层 zip，
      # 解压后即是平铺的刷机文件，不再出现"zip 套 zip"
      - uses: actions/upload-artifact@v4
        with:
          name: klipper-remote-esp32-${{ matrix.board }}-${{ github.ref_name }}
          path: dist/

  desktop-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-cjson
            mingw-w64-ucrt-x86_64-openssl
            zip

      - name: Fetch LVGL v9.3.0 (third_party/lvgl is gitignored)
        shell: msys2 {0}
        run: |
          curl -L -o /tmp/lvgl.tar.gz https://github.com/lvgl/lvgl/archive/refs/tags/v9.3.0.tar.gz
          tar xzf /tmp/lvgl.tar.gz -C /tmp
          mkdir -p third_party
          mv /tmp/lvgl-9.3.0 third_party/lvgl

      - name: Build Windows desktop (SDL2)
        shell: msys2 {0}
        run: |
          export PATH=/ucrt64/bin:$PATH
          cd src/ports/desktop
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp /ucrt64/bin/SDL2.dll build/

      - name: Package desktop exe
        shell: msys2 {0}
        run: |
          mkdir -p dist-win
          cp src/ports/desktop/build/klipper_remote_desktop.exe src/ports/desktop/build/klipper_remote_simulator.exe src/ports/desktop/build/SDL2.dll dist-win/
          cp /ucrt64/share/licenses/cjson/LICENSE dist-win/cJSON-LICENSE.txt
          ls -la dist-win

      - uses: actions/upload-artifact@v4
        with:
          name: klipper-remote-desktop-win-x86_64-${{ github.ref_name }}
          path: dist-win/

  desktop-mac:
    runs-on: macos-latest   # arm64 runner
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja sdl2 cjson

      - name: Fetch LVGL v9.3.0 (third_party/lvgl is gitignored)
        run: |
          curl -L -o /tmp/lvgl.tar.gz https://github.com/lvgl/lvgl/archive/refs/tags/v9.3.0.tar.gz
          tar xzf /tmp/lvgl.tar.gz -C /tmp
          mkdir -p third_party
          mv /tmp/lvgl-9.3.0 third_party/lvgl

      - name: Build macOS desktop (SDL2)
        run: |
          cd src/ports/desktop
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build

      - name: Package desktop app
        # 把 SDL2 / cjson 的 dylib 拷到可执行文件旁边，引用改成 @executable_path 相对路径，
        # 产物脱离 brew 也能跑。引用路径从 otool 实际记录读，不猜 brew 布局。
        run: |
          set -e
          BUILD=src/ports/desktop/build
          mkdir -p dist-mac
          cp "$BUILD/klipper_remote_desktop" "$BUILD/klipper_remote_simulator" dist-mac/

          SDL_REF=$(otool -L "$BUILD/klipper_remote_desktop" | awk '/libSDL2.*dylib/{print $1; exit}')
          CJSON_REF=$(otool -L "$BUILD/klipper_remote_desktop" | awk '/libcjson.*dylib/{print $1; exit}')
          if [ -z "$SDL_REF" ] || [ -z "$CJSON_REF" ]; then
            echo "missing dylib refs:"; otool -L "$BUILD/klipper_remote_desktop"; exit 1
          fi

          SDL_DYLIB=$(basename "$SDL_REF")
          CJSON_DYLIB=$(basename "$CJSON_REF")
          cp "$SDL_REF" "$CJSON_REF" dist-mac/
          chmod +w "dist-mac/$SDL_DYLIB" "dist-mac/$CJSON_DYLIB"
          # dylib 自身的 id 也要改，否则其他 mach-o 链它时记下的仍是 brew 绝对路径
          install_name_tool -id "@executable_path/$SDL_DYLIB" "dist-mac/$SDL_DYLIB"
          install_name_tool -id "@executable_path/$CJSON_DYLIB" "dist-mac/$CJSON_DYLIB"
          for exe in klipper_remote_desktop klipper_remote_simulator; do
            install_name_tool -change "$SDL_REF" "@executable_path/$SDL_DYLIB" "dist-mac/$exe"
          done
          install_name_tool -change "$CJSON_REF" "@executable_path/$CJSON_DYLIB" \
            dist-mac/klipper_remote_desktop

          # install_name_tool 会弄坏 arm64 的 ad-hoc 签名，重签（无证书签名即可跑）
          codesign --force --sign - dist-mac/klipper_remote_desktop \
            dist-mac/klipper_remote_simulator "dist-mac/$SDL_DYLIB" "dist-mac/$CJSON_DYLIB"

          # brew 不像 msys2 装 share/licenses，按所装版本从上游仓库取 cJSON LICENSE
          CJSON_VER=$(brew list --versions cjson | awk '{print $2}')
          curl -fL -o dist-mac/cJSON-LICENSE.txt \
            "https://raw.githubusercontent.com/DaveGamble/cJSON/v${CJSON_VER}/LICENSE" || \
          curl -fL -o dist-mac/cJSON-LICENSE.txt \
            "https://raw.githubusercontent.com/DaveGamble/cJSON/master/LICENSE"

          otool -L dist-mac/klipper_remote_desktop   # 验证引用已全部指向 @executable_path
          ls -la dist-mac

      - uses: actions/upload-artifact@v4
        with:
          name: klipper-remote-desktop-macos-arm64-${{ github.ref_name }}
          path: dist-mac/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, desktop-win, desktop-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Zip artifacts for release
        # 资产名不带版本号：releases/latest/download/<名字> 直链永远指向最新正式版，
        # 文档站板型页的下载链接依赖这一点
        run: |
          for d in dl/klipper-remote-esp32-*; do
            b=$(basename "$d")
            b="${b%-${GITHUB_REF_NAME}}"
            (cd "$d" && zip -r "$GITHUB_WORKSPACE/$b.zip" .)
          done
          (cd dl/klipper-remote-desktop-win-x86_64-* && zip -r "$GITHUB_WORKSPACE/klipper-remote-desktop-win-x86_64.zip" .)
          # artifact 往返可能丢 unix 执行位，zip 前先补回（zip 会保存权限位）
          (cd dl/klipper-remote-desktop-macos-arm64-* && chmod +x klipper_remote_desktop klipper_remote_simulator && zip -r "$GITHUB_WORKSPACE/klipper-remote-desktop-macos-arm64.zip" .)
          ls -la "$GITHUB_WORKSPACE"/*.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            klipper-remote-esp32-*.zip
            klipper-remote-desktop-win-x86_64*.zip
            klipper-remote-desktop-macos-arm64*.zip
          # 板型产物说明（引脚/接线/刷机地址）见文档站，自动生成 notes 会附加在其后
          body: |
            **Supported boards / 支持的板型**: https://umeiko.github.io/KlipperScreen-esp/boards/

            每个 `klipper-remote-esp32-<board>.zip` 对应一种板型，刷机前请先在上方页面确认你板子的产物名称、接线与刷机说明。
          generate_release_notes: true
          # 标签含 wip（如 v0.2.0-wip.1）时标为预发布，不抢占 latest
          prerelease: ${{ contains(github.ref_name, 'wip') }}

      # 维护 latest 移动标签：始终指向最新正式版提交（wip 预发布不移动）
      - name: Move latest tag
        if: ${{ !contains(github.ref_name, 'wip') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
