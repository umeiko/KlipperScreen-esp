name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 16 个板型按芯片合并为 3 个 shard Job：同一 shard 在同一 IDF 容器内顺序构建，
  # 共享按 shard 分开的 ccache。单板构建失败不中断其余板型：收集失败列表，
  # 上传可用的部分产物与失败日志后，在末尾令 shard 失败。
  firmware:
    name: firmware (${{ matrix.shard }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    strategy:
      fail-fast: false
      matrix:
        shard: [esp32, esp32s3, esp32c3]
    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        # 镜像自带则直接用；否则尝试安装；都失败则降级为无缓存构建
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends ccache \
              || echo "::warning::ccache unavailable, building without cache"
          fi
          ccache --version || true

      - name: ccache cache (${{ matrix.shard }})
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.shard }}-

      # board|build_dir|sdkconfig|sdkconfig_defaults|chip|flash_size|bootloader_offset
      - name: Build firmware shard (${{ matrix.shard }})
        shell: bash
        env:
          IDF_CCACHE_ENABLE: "1"
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"

          boards_table() {
            case "${{ matrix.shard }}" in
            esp32)
              cat <<'EOF'
          cyd_2432s028r|build|sdkconfig|sdkconfig.defaults;sdkconfig.defaults.cyd_2432s028r|esp32|4MB|0x1000
          cyd_2432s028r_plus|build-cyd-plus|sdkconfig.cyd_2432s028r_plus|sdkconfig.defaults;sdkconfig.defaults.cyd_2432s028r_plus|esp32|4MB|0x1000
          e32r35t|build-e32r35t|sdkconfig.e32r35t|sdkconfig.defaults;sdkconfig.defaults.e32r35t|esp32|4MB|0x1000
          esp32-st7735s-128_160-ec11|build-ec11-knob-esp32|sdkconfig.esp32-st7735s-128_160-ec11|sdkconfig.defaults;sdkconfig.defaults.esp32-st7735s-128_160-ec11|esp32|4MB|0x1000
          esp32-st7789-320_240-ec11|build-ec11-knob-esp32-st7789|sdkconfig.esp32-st7789-320_240-ec11|sdkconfig.defaults;sdkconfig.defaults.esp32-st7789-320_240-ec11|esp32|4MB|0x1000
          esp32-ILI9341-320_240-ec11|build-esp32-ili9341-ec11|sdkconfig.esp32-ILI9341-320_240-ec11|sdkconfig.defaults;sdkconfig.defaults.esp32-ILI9341-320_240-ec11|esp32|4MB|0x1000
          esp32-ST7796-320_240-ec11|build-esp32-st7796-ec11|sdkconfig.esp32-ST7796-320_240-ec11|sdkconfig.defaults;sdkconfig.defaults.esp32-ST7796-320_240-ec11|esp32|4MB|0x1000
          EOF
              ;;
            esp32s3)
              cat <<'EOF'
          esp32s3-st7789-320_240-ec11|build-ec11-knob-minimal|sdkconfig.esp32s3-st7789-320_240-ec11|sdkconfig.defaults;sdkconfig.defaults.esp32s3-st7789-320_240-ec11|esp32s3|16MB|0x0
          esp32s3-st7796-480_320-xpt2046-ec11|build-esp32s3-st7796-ec11|sdkconfig.esp32s3-st7796-480_320-xpt2046-ec11|sdkconfig.defaults;sdkconfig.defaults.esp32s3-st7796-480_320-xpt2046-ec11|esp32s3|16MB|0x0
          esp32s3-ILI9488-480_320-xpt2046-ec11|build-esp32s3-ili9488-ec11|sdkconfig.esp32s3-ILI9488-480_320-xpt2046-ec11|sdkconfig.defaults;sdkconfig.defaults.esp32s3-ILI9488-480_320-xpt2046-ec11|esp32s3|16MB|0x0
          esp32s3-ILI9341-320_240-xpt2046-ec11|build-esp32s3-ili9341-ec11|sdkconfig.esp32s3-ILI9341-320_240-xpt2046-ec11|sdkconfig.defaults;sdkconfig.defaults.esp32s3-ILI9341-320_240-xpt2046-ec11|esp32s3|16MB|0x0
          jc8048w550|build-jc8048w550|sdkconfig.jc8048w550|sdkconfig.defaults;sdkconfig.defaults.jc8048w550|esp32s3|16MB|0x0
          esp32s3-sensecap-indicator|build-sensecap-indicator|sdkconfig.esp32s3-sensecap-indicator|sdkconfig.defaults;sdkconfig.defaults.esp32s3-sensecap-indicator|esp32s3|8MB|0x0
          esp32s3-JLC-SZP|build-esp32s3-jlc-szp|sdkconfig.esp32s3-JLC-SZP|sdkconfig.defaults;sdkconfig.defaults.esp32s3-JLC-SZP|esp32s3|16MB|0x0
          esp32s3-retro-go|build-esp32s3-retro-go|sdkconfig.esp32s3-retro-go|sdkconfig.defaults;sdkconfig.defaults.esp32s3-retro-go|esp32s3|16MB|0x0
          EOF
              ;;
            esp32c3)
              cat <<'EOF'
          esp32c3-st7789-320_240-ec11|build-esp32c3-st7789-ec11|sdkconfig.esp32c3-st7789-320_240-ec11|sdkconfig.defaults;sdkconfig.defaults.esp32c3-st7789-320_240-ec11|esp32c3|4MB|0x0
          EOF
              ;;
            esac
          }

          cd src/ports/esp32
          FAILED=""
          mkdir -p "$GITHUB_WORKSPACE/artifacts/_logs"

          build_one() {
            board="$1"; bdir="$2"; sdkcfg="$3"; defs="$4"; chip="$5"; flash_size="$6"; bl_offset="$7"
            log="$GITHUB_WORKSPACE/artifacts/_logs/$board.log"
            echo "=== [${{ matrix.shard }}] $board (build dir: $bdir) ==="
            if [ ! -f "$sdkcfg" ]; then
              idf.py -B "$bdir" -DSDKCONFIG="$sdkcfg" -DSDKCONFIG_DEFAULTS="$defs" \
                     set-target "${{ matrix.shard }}" >"$log" 2>&1 || return 1
            fi
            idf.py -B "$bdir" -DSDKCONFIG="$sdkcfg" -DSDKCONFIG_DEFAULTS="$defs" build >>"$log" 2>&1 || return 1
            dest="$GITHUB_WORKSPACE/artifacts/$board"
            mkdir -p "$dest"
            cp "$bdir/bootloader/bootloader.bin" \
               "$bdir/partition_table/partition-table.bin" \
               "$bdir/klipper_remote_display.bin" "$dest/" || return 1
            if [[ "$GITHUB_REF_NAME" == *wip* ]]; then
              mkdir -p "$GITHUB_WORKSPACE/symbols"
              cp "$bdir/klipper_remote_display.elf" "$GITHUB_WORKSPACE/symbols/$board.elf" || return 1
            fi
            # 板型参数随产物走：刷机脚本读 flash.cfg 决定 chip/flash 大小/bootloader 偏移；
            # TOUCH_CAL=1 标记电阻触摸屏板型（XPT2046），刷机脚本据此提供校准引导
            touch_cal=0
            case "$board" in
              cyd_2432s028r|cyd_2432s028r_plus|e32r35t|\
              esp32s3-st7796-480_320-xpt2046-ec11|esp32s3-ILI9488-480_320-xpt2046-ec11|\
              esp32s3-ILI9341-320_240-xpt2046-ec11) touch_cal=1 ;;
            esac
            printf 'CHIP=%s\nFLASH_SIZE=%s\nBL_OFFSET=%s\nTOUCH_CAL=%s\n' "$chip" "$flash_size" "$bl_offset" "$touch_cal" > "$dest/flash.cfg"
            rm -f "$log"   # 成功板的构建日志不留档
          }

          while IFS='|' read -r board bdir sdkcfg defs chip flash_size bl_offset; do
            [ -n "$board" ] || continue
            if build_one "$board" "$bdir" "$sdkcfg" "$defs" "$chip" "$flash_size" "$bl_offset"; then
              echo "OK: $board"
            else
              echo "::error::board $board build failed, log tail:"
              tail -n 80 "$GITHUB_WORKSPACE/artifacts/_logs/$board.log" || true
              FAILED="$FAILED $board"
            fi
          done < <(boards_table)

          : > "$GITHUB_WORKSPACE/failed.txt"
          for b in $FAILED; do echo "$b" >> "$GITHUB_WORKSPACE/failed.txt"; done
          echo "shard ${{ matrix.shard }} done; failed boards:${FAILED:- none}"
          ccache -s || true

      # 聚合 artifact：按 board 分目录（bootloader/partition-table/klipper_remote_display/flash.cfg），
      # _logs/ 下只有失败板的完整构建日志
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: warn

      - name: Preserve exact pre-release debug symbols
        if: ${{ always() && contains(github.ref_name, 'wip') }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ matrix.shard }}-${{ github.ref_name }}
          path: symbols/*.elf
          retention-days: 30
          if-no-files-found: warn

      - name: Report failed boards
        run: |
          if [ -s failed.txt ]; then
            echo "::error::shard ${{ matrix.shard }} failed boards: $(paste -sd' ' failed.txt)"
            exit 1
          fi

  # 15 个板型统一打包：只下载三个 shard 聚合 artifact，esptool 只下载一次，
  # 每个 board 生成与逐板打包完全等价的平铺刷机目录
  package:
    runs-on: ubuntu-latest
    needs: firmware
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware-esp32
          path: fw/esp32

      - uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3
          path: fw/esp32s3

      - uses: actions/download-artifact@v4
        with:
          name: firmware-esp32c3
          path: fw/esp32c3

      - name: Download esptool (Windows standalone)
        run: |
          # GitHub API 匿名限流时拿不到 latest 标签：重试，失败则回退到固定版本
          TAG=$(curl -sf --retry 5 --retry-all-errors \
                https://api.github.com/repos/espressif/esptool/releases/latest | jq -r .tag_name) || TAG=""
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            TAG=v5.4.0
            echo "GitHub API unavailable, falling back to esptool $TAG"
          fi
          echo "esptool $TAG"
          curl -fL --retry 5 --retry-all-errors -o /tmp/esptool.zip \
            "https://github.com/espressif/esptool/releases/download/${TAG}/esptool-${TAG}-windows-amd64.zip"
          unzip -o /tmp/esptool.zip -d /tmp/esptool
          find /tmp/esptool -name esptool.exe -exec cp {} /tmp/esptool.exe \;

      - name: Assemble per-board flash packages
        run: |
          set -e
          BOARDS="cyd_2432s028r cyd_2432s028r_plus e32r35t esp32-st7735s-128_160-ec11 esp32-st7789-320_240-ec11 esp32-ILI9341-320_240-ec11 esp32-ST7796-320_240-ec11 esp32s3-st7789-320_240-ec11 esp32s3-st7796-480_320-xpt2046-ec11 esp32s3-ILI9488-480_320-xpt2046-ec11 esp32s3-ILI9341-320_240-xpt2046-ec11 esp32c3-st7789-320_240-ec11 jc8048w550 esp32s3-sensecap-indicator esp32s3-JLC-SZP esp32s3-retro-go"
          for board in $BOARDS; do
            case "$board" in
              cyd_2432s028r|cyd_2432s028r_plus|e32r35t|esp32-st7735s-128_160-ec11|esp32-st7789-320_240-ec11|esp32-ILI9341-320_240-ec11|esp32-ST7796-320_240-ec11)
                shard=esp32 ;;
              esp32c3-st7789-320_240-ec11)
                shard=esp32c3 ;;
              *) shard=esp32s3 ;;
            esac
            src="fw/$shard/$board"
            dest="pkg/ESP-IDFv5.5-$board"
            mkdir -p "$dest"
            cp "$src/bootloader.bin" "$src/partition-table.bin" \
               "$src/klipper_remote_display.bin" "$src/flash.cfg" "$dest/"
            cp /tmp/esptool.exe "$dest/"
            cp tools/release/flash.bat tools/release/flash.sh "$dest/"
            chmod +x "$dest/flash.sh"
            if [ "$board" = "esp32s3-st7789-320_240-ec11" ]; then
              cp tools/release/README-esp32s3-st7789-320_240-ec11.md "$dest/README.md"
              cp docs/hardware/ec11_knob_minimal.fzz "$dest/"
              cp docs/screenshots/boards/ec11_knob_minimal_breadboard.zh.png "$dest/"
              cp docs/screenshots/boards/ec11_knob_minimal_breadboard.en.png "$dest/"
            fi
            echo "packaged $board:"
            ls "$dest"
          done
          count=$(ls -d pkg/ESP-IDFv5.5-* | wc -l)
          [ "$count" -eq 16 ] || { echo "::error::expected 16 board packages, got $count"; exit 1; }

      # 聚合 package artifact：内部按 ESP-IDFv5.5-<board> 目录划分
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.ref_name }}
          path: pkg/

  desktop-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-cjson
            mingw-w64-ucrt-x86_64-openssl
            zip

      - name: Fetch LVGL v9.3.0 (third_party/lvgl is gitignored)
        shell: msys2 {0}
        run: |
          curl -L -o /tmp/lvgl.tar.gz https://github.com/lvgl/lvgl/archive/refs/tags/v9.3.0.tar.gz
          tar xzf /tmp/lvgl.tar.gz -C /tmp
          mkdir -p third_party
          mv /tmp/lvgl-9.3.0 third_party/lvgl

      - name: Build Windows desktop (SDL2)
        shell: msys2 {0}
        run: |
          export PATH=/ucrt64/bin:$PATH
          cd src/ports/desktop
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cp /ucrt64/bin/SDL2.dll build/

      - name: Package desktop exe
        shell: msys2 {0}
        run: |
          mkdir -p dist-win
          cp src/ports/desktop/build/KlipperScreen-esp.exe src/ports/desktop/build/klipper_remote_simulator.exe src/ports/desktop/build/SDL2.dll dist-win/
          cp /ucrt64/share/licenses/cjson/LICENSE dist-win/cJSON-LICENSE.txt
          ls -la dist-win

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win-x86_64-${{ github.ref_name }}
          path: dist-win/

  desktop-mac:
    runs-on: macos-latest   # arm64 runner
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja sdl2 cjson

      - name: Fetch LVGL v9.3.0 (third_party/lvgl is gitignored)
        run: |
          curl -L -o /tmp/lvgl.tar.gz https://github.com/lvgl/lvgl/archive/refs/tags/v9.3.0.tar.gz
          tar xzf /tmp/lvgl.tar.gz -C /tmp
          mkdir -p third_party
          mv /tmp/lvgl-9.3.0 third_party/lvgl

      - name: Build macOS desktop (SDL2)
        run: |
          cd src/ports/desktop
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build

      - name: Package desktop app
        # 把 SDL2 / cjson 的 dylib 拷到可执行文件旁边，引用改成 @executable_path 相对路径，
        # 产物脱离 brew 也能跑。引用路径从 otool 实际记录读，不猜 brew 布局。
        run: |
          set -e
          BUILD=src/ports/desktop/build
          mkdir -p dist-mac
          cp "$BUILD/KlipperScreen-esp" "$BUILD/klipper_remote_simulator" dist-mac/

          SDL_REF=$(otool -L "$BUILD/KlipperScreen-esp" | awk '/libSDL2.*dylib/{print $1; exit}')
          CJSON_REF=$(otool -L "$BUILD/KlipperScreen-esp" | awk '/libcjson.*dylib/{print $1; exit}')
          if [ -z "$SDL_REF" ] || [ -z "$CJSON_REF" ]; then
            echo "missing dylib refs:"; otool -L "$BUILD/KlipperScreen-esp"; exit 1
          fi

          SDL_DYLIB=$(basename "$SDL_REF")
          CJSON_DYLIB=$(basename "$CJSON_REF")
          cp "$SDL_REF" "$CJSON_REF" dist-mac/
          chmod +w "dist-mac/$SDL_DYLIB" "dist-mac/$CJSON_DYLIB"
          # dylib 自身的 id 也要改，否则其他 mach-o 链它时记下的仍是 brew 绝对路径
          install_name_tool -id "@executable_path/$SDL_DYLIB" "dist-mac/$SDL_DYLIB"
          install_name_tool -id "@executable_path/$CJSON_DYLIB" "dist-mac/$CJSON_DYLIB"
          for exe in KlipperScreen-esp klipper_remote_simulator; do
            install_name_tool -change "$SDL_REF" "@executable_path/$SDL_DYLIB" "dist-mac/$exe"
          done
          install_name_tool -change "$CJSON_REF" "@executable_path/$CJSON_DYLIB" \
            dist-mac/KlipperScreen-esp

          # install_name_tool 会弄坏 arm64 的 ad-hoc 签名，重签（无证书签名即可跑）
          codesign --force --sign - dist-mac/KlipperScreen-esp \
            dist-mac/klipper_remote_simulator "dist-mac/$SDL_DYLIB" "dist-mac/$CJSON_DYLIB"

          # brew 不像 msys2 装 share/licenses，按所装版本从上游仓库取 cJSON LICENSE
          CJSON_VER=$(brew list --versions cjson | awk '{print $2}')
          curl -fL -o dist-mac/cJSON-LICENSE.txt \
            "https://raw.githubusercontent.com/DaveGamble/cJSON/v${CJSON_VER}/LICENSE" || \
          curl -fL -o dist-mac/cJSON-LICENSE.txt \
            "https://raw.githubusercontent.com/DaveGamble/cJSON/master/LICENSE"

          otool -L dist-mac/KlipperScreen-esp   # 验证引用已全部指向 @executable_path
          ls -la dist-mac

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64-${{ github.ref_name }}
          path: dist-mac/

  desktop-linux:
    # 预编译 Linux 二进制：上位机（x86_64 / aarch64 的 Klipper 主机）不装编译链，
    # 解压 tar.gz 跑 install.sh 即可。SDL2/cJSON 静态链接（X11/Wayland 库运行时
    # dlopen），二进制只依赖 glibc；ubuntu-22.04 构建保证 glibc>=2.35 的发行版都能跑。
    strategy:
      matrix:
        include:
          - { runs-on: ubuntu-22.04,     arch: x86_64 }
          - { runs-on: ubuntu-22.04-arm, arch: arm64 }
          # armhf 无官方 runner，x86_64 上交叉编译（arm-linux-gnueabihf）
          - { runs-on: ubuntu-22.04,     arch: armhf, cross: arm-linux-gnueabihf }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (native)
        if: ${{ !matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config curl ca-certificates \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxss-dev libxkbcommon-dev libwayland-dev libwayland-bin wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev

      - name: Install armhf cross toolchain + multiarch deps
        if: ${{ matrix.cross }}
        run: |
          # runner 的 azure 镜像只带 amd64/i386，armhf 要走 ports.ubuntu.com：
          # 先把现有源钉死 amd64，再为 armhf 加 ports 源，否则 apt update 404
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          for suite in jammy jammy-updates jammy-security; do
            echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports $suite main universe"
          done | sudo tee /etc/apt/sources.list.d/armhf.list
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config curl ca-certificates \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            libx11-dev:armhf libxext-dev:armhf libxrandr-dev:armhf libxcursor-dev:armhf \
            libxi-dev:armhf libxfixes-dev:armhf libxss-dev:armhf libxkbcommon-dev:armhf \
            libwayland-dev:armhf wayland-protocols libegl1-mesa-dev:armhf \
            libgles2-mesa-dev:armhf libdrm-dev:armhf libgbm-dev:armhf \
            libasound2-dev:armhf libpulse-dev:armhf libudev-dev:armhf libdbus-1-dev:armhf
          # SDL2 的 X11/Wayland 检测走 pkg-config，必须指向 armhf 的 .pc 目录
          cat > /tmp/armhf.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-linux-gnueabihf-gcc)
          set(CMAKE_CXX_COMPILER arm-linux-gnueabihf-g++)
          set(CMAKE_FIND_ROOT_PATH /usr/arm-linux-gnueabihf /usr)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY BOTH)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE BOTH)
          set(ENV{PKG_CONFIG_LIBDIR} "/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig")
          EOF

      - name: Fetch LVGL v9.3.0 (third_party/lvgl is gitignored)
        run: |
          curl -L -o /tmp/lvgl.tar.gz https://github.com/lvgl/lvgl/archive/refs/tags/v9.3.0.tar.gz
          tar xzf /tmp/lvgl.tar.gz -C /tmp
          mkdir -p third_party
          mv /tmp/lvgl-9.3.0 third_party/lvgl

      - name: Fetch mbedTLS + CA bundle (Bambu POSIX backend, static)
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            --branch v3.6.5 https://github.com/Mbed-TLS/mbedtls.git third_party/mbedtls
          curl -fL --retry 5 --retry-all-errors -o third_party/cacert.pem https://curl.se/ca/cacert.pem

      - name: Build static SDL2
        run: |
          curl -L -o /tmp/sdl2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz
          tar xzf /tmp/sdl2.tar.gz -C /tmp
          TC=""
          if [ -n "${{ matrix.cross }}" ]; then TC="-DCMAKE_TOOLCHAIN_FILE=/tmp/armhf.cmake"; fi
          cmake -S /tmp/SDL2-2.30.9 -B /tmp/sdl2-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl2-install $TC
          cmake --build /tmp/sdl2-build
          cmake --install /tmp/sdl2-build

      - name: Build static cJSON
        run: |
          curl -L -o /tmp/cjson.tar.gz https://github.com/DaveGamble/cJSON/archive/refs/tags/v1.7.18.tar.gz
          tar xzf /tmp/cjson.tar.gz -C /tmp
          TC=""
          if [ -n "${{ matrix.cross }}" ]; then TC="-DCMAKE_TOOLCHAIN_FILE=/tmp/armhf.cmake"; fi
          cmake -S /tmp/cJSON-1.7.18 -B /tmp/cjson-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DENABLE_CJSON_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/cjson-install $TC
          cmake --build /tmp/cjson-build
          cmake --install /tmp/cjson-build

      - name: Build KlipperScreen-esp (Linux)
        run: |
          cd src/ports/desktop
          TC=""
          if [ -n "${{ matrix.cross }}" ]; then TC="-DCMAKE_TOOLCHAIN_FILE=/tmp/armhf.cmake"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/tmp/sdl2-install;/tmp/cjson-install" $TC
          cmake --build build --target KlipperScreen-esp
          # 静态链接验收：动态依赖里不得出现 SDL2 / cjson
          if [ -n "${{ matrix.cross }}" ]; then
            arm-linux-gnueabihf-objdump -p build/KlipperScreen-esp | grep NEEDED
            if arm-linux-gnueabihf-objdump -p build/KlipperScreen-esp | grep NEEDED | grep -Ei 'sdl|cjson'; then
              echo "::error::SDL2/cJSON not statically linked"; exit 1
            fi
          else
            if ldd build/KlipperScreen-esp | grep -Ei 'sdl|cjson'; then
              echo "::error::SDL2/cJSON not statically linked"; exit 1
            fi
            ldd build/KlipperScreen-esp
          fi

      - name: Package tarball (bin + install.sh + systemd unit)
        run: |
          PKG=dist-linux
          mkdir -p "$PKG/bin"
          cp src/ports/desktop/build/KlipperScreen-esp "$PKG/bin/"
          cp scripts/linux/install.sh scripts/linux/uninstall.sh \
             scripts/linux/KlipperScreen-esp-start.sh scripts/linux/KlipperScreen-esp.service "$PKG/"
          chmod +x "$PKG/bin/KlipperScreen-esp" "$PKG/install.sh" "$PKG/uninstall.sh" \
             "$PKG/KlipperScreen-esp-start.sh"
          tar czf desktop-linux-${{ matrix.arch }}.tar.gz -C "$PKG" .
          tar tzf desktop-linux-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}-${{ github.ref_name }}
          path: desktop-linux-${{ matrix.arch }}.tar.gz

  android:
    # Android APK：SDL2 安卓工程（src/ports/android）复用 desktop 端全套 UI 代码，
    # CMake 编 libmain.so + libSDL2.so，Gradle 打包。release 构建用 debug 密钥
    # 签名（可直接侧载）；确认可用性之前不进 release job，只出 artifact。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v4   # 只图它的 Gradle 缓存，wrapper 用库内的

      - name: Fetch LVGL v9.3.0 (third_party/lvgl is gitignored)
        run: |
          curl -L -o /tmp/lvgl.tar.gz https://github.com/lvgl/lvgl/archive/refs/tags/v9.3.0.tar.gz
          tar xzf /tmp/lvgl.tar.gz -C /tmp
          mkdir -p third_party
          mv /tmp/lvgl-9.3.0 third_party/lvgl

      - name: Fetch Android native deps (SDL2 2.30.9 + cJSON + SDLActivity glue)
        run: bash tools/fetch-android-deps.sh

      - name: Check Android SDK platform / NDK
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
          fi
          NDK_VER=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)
          [ -n "$NDK_VER" ] || { echo "::error::no NDK installed in $ANDROID_HOME/ndk"; exit 1; }
          echo "platforms: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"
          echo "using NDK $NDK_VER"
          echo "NDK_VER=$NDK_VER" >> "$GITHUB_ENV"

      - name: Build APK (Gradle + CMake/NDK)
        # bash gradlew：不依赖 git 提交时的 +x 位（Windows 上易丢）
        env:
          SDL2_ROOT: ${{ github.workspace }}/third_party/SDL2
        run: |
          cd src/ports/android
          bash gradlew --no-daemon assembleRelease -PndkVersion="$NDK_VER"

      - name: Package APK
        run: |
          mkdir -p dist-android
          cp src/ports/android/app/build/outputs/apk/release/app-release.apk \
             dist-android/KlipperScreen-esp-android.apk
          ls -la dist-android

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: dist-android/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, desktop-win, desktop-mac, desktop-linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ github.ref_name }}
          path: dl/pkg

      - uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: dl/android

      - uses: actions/download-artifact@v4
        with:
          name: desktop-win-x86_64-${{ github.ref_name }}
          path: dl/desktop-win

      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64-${{ github.ref_name }}
          path: dl/desktop-mac

      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-x86_64-${{ github.ref_name }}
          path: dl/linux-x64

      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-arm64-${{ github.ref_name }}
          path: dl/linux-arm64

      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-armhf-${{ github.ref_name }}
          path: dl/linux-armhf

      - name: Zip artifacts for release
        # 资产名不带版本号：releases/latest/download/<名字> 直链永远指向最新正式版，
        # 文档站板型页的下载链接依赖这一点
        run: |
          count=$(ls -d dl/pkg/ESP-IDFv5.5-* | wc -l)
          [ "$count" -eq 16 ] || { echo "::error::expected 16 board packages, got $count"; exit 1; }
          for d in dl/pkg/ESP-IDFv5.5-*; do
            b=$(basename "$d")
            (cd "$d" && zip -r "$GITHUB_WORKSPACE/$b.zip" .)
          done
          (cd dl/desktop-win && zip -r "$GITHUB_WORKSPACE/desktop-win-x86_64.zip" .)
          # artifact 往返可能丢 unix 执行位，zip 前先补回（zip 会保存权限位）
          (cd dl/desktop-mac && chmod +x KlipperScreen-esp klipper_remote_simulator && zip -r "$GITHUB_WORKSPACE/desktop-macos-arm64.zip" .)
          # Android APK 已是成品（CI 已按固定测试密钥签名），直接搬上来
          cp dl/android/KlipperScreen-esp-android.apk "$GITHUB_WORKSPACE/"
          # Linux 产物在构建 job 里已打成 tar.gz（保留执行位），直接搬上来
          cp dl/linux-x64/desktop-linux-x86_64.tar.gz dl/linux-arm64/desktop-linux-arm64.tar.gz \
             dl/linux-armhf/desktop-linux-armhf.tar.gz "$GITHUB_WORKSPACE/"
          # md5 边车：Linux 上位机与 Android 自更新下载后据此校验完整性
          for f in desktop-linux-x86_64.tar.gz desktop-linux-arm64.tar.gz desktop-linux-armhf.tar.gz KlipperScreen-esp-android.apk; do
            (cd "$GITHUB_WORKSPACE" && md5sum "$f" > "$f.md5")
          done
          ls -la "$GITHUB_WORKSPACE"/*.zip "$GITHUB_WORKSPACE"/*.tar.gz "$GITHUB_WORKSPACE"/*.md5

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ESP-IDFv5.5-*.zip
            desktop-win-x86_64.zip
            desktop-macos-arm64.zip
            desktop-linux-x86_64.tar.gz
            desktop-linux-arm64.tar.gz
            desktop-linux-armhf.tar.gz
            desktop-linux-x86_64.tar.gz.md5
            desktop-linux-arm64.tar.gz.md5
            desktop-linux-armhf.tar.gz.md5
            KlipperScreen-esp-android.apk
            KlipperScreen-esp-android.apk.md5
          # 板型产物说明（引脚/接线/刷机地址）见文档站，自动生成 notes 会附加在其后
          body: |
            **Supported boards / 支持的板型**: https://umeiko.github.io/KlipperScreen-esp/boards/

            每个 `ESP-IDFv5.5-<board>.zip` 是一种板型的固件刷机包（ESP-IDF v5.5.5 构建，资产名不带版本号）；`desktop-win-x86_64.zip` 与 `desktop-macos-arm64.zip` 是 Windows / macOS 桌面端；`desktop-linux-x86_64.tar.gz` / `desktop-linux-arm64.tar.gz` / `desktop-linux-armhf.tar.gz` 是 Linux 上位机预编译包（静态链接 SDL2，解压后运行 `install.sh`，可选 systemd 独占显示服务或桌面 App，支持 Wayland-weston / X11）；`KlipperScreen-esp-android.apk` 是 Android 手机/平板端（方向跟随系统旋转，侧载安装，与桌面端同一套 UI）。刷机前请先在上方页面确认你板子的产物名称、接线与刷机说明。

            **本版更新 / What's new**
            - 修复：传感器页限位查询命令拼写——`QUERY_ENDSTOP` → `QUERY_ENDSTOPS`（对齐 Klipper 文档/fluidd；此前上位机反复报 Unknown command，限位状态页拿不到数据）/ Fix endstop query command spelling (QUERY_ENDSTOPS); hosts no longer report Unknown command
            - 修复：Linux 上位机电源键独占抓取（EVIOCGRAB），修"按一下偶尔直接关机"；logind drop-in 降级为兜底 / Power key grabbed exclusively on Linux hosts (no more accidental poweroff)
            - 修复：安装脚本为 kiosk 服务模式补 NetworkManager 授权（netdev 组 + polkit 规则），WiFi 页在服务模式下可用 / Installer grants NetworkManager access for service-mode installs
          generate_release_notes: true
          # 标签含 wip（如 v0.2.0-wip.1）时标为预发布，不抢占 latest
          prerelease: ${{ contains(github.ref_name, 'wip') }}

      # 清理同一 tag 下旧命名（klipper-remote- 前缀）的遗留资产：在新资产全部
      # 上传成功后执行；按资产 id 删除，匹配不到时正常退出（可重复执行）。
      # GitHub 自动生成的 Source code zip/tar 不是自定义资产，不会被匹配。
      - name: Remove legacy klipper-remote-* assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            --jq '.assets[] | select(.name | startswith("klipper-remote-")) | .id' \
          | while read -r id; do
              [ -n "$id" ] || continue
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
              echo "deleted legacy asset id=$id"
            done

      # 维护 latest 移动标签：始终指向最新正式版提交（wip 预发布不移动）
      - name: Move latest tag
        if: ${{ !contains(github.ref_name, 'wip') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
