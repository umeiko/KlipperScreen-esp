site_name: KlipperScreen-esp 文档 / Docs
site_description: 跨平台 3D 打印机显示与控制软件（ESP32 / Windows / Linux / macOS，Klipper / Moonraker + 拓竹云端监视）— board porting & contribution guides
site_url: https://umeiko.github.io/KlipperScreen-esp/
repo_url: https://github.com/umeiko/KlipperScreen-esp
edit_uri: edit/main/docs/
copyright: Copyright &copy; umeiko, MIT

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.action.edit

plugins:
  - search:
      separator: '[\s\-\.,:!=\[\]()"/]+'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
        - locale: zh
          name: 简体中文
          nav_translations:
            Home: 首页
            Screenshots: 界面展示
            Supported boards: 支持的板子
            Overview: 总览
            ESP32 boards: ESP32 板型
            ESP32-S3 boards: ESP32-S3 板型
            ESP32-C3 boards: ESP32-C3 板型
            Linux client: Linux 客户端
            Windows / macOS client: Windows / macOS 客户端
            Android client: Android 客户端
            Display and encoder settings: 显示与编码器设置
            Porting to your own board: 移植到自己的开发板
            Developer notes: 开发笔记
            Architecture: 架构说明
            Building from source: 从源码构建
            File-list issue 8 retest: 文件列表 issue 8 复测
            JC8048W550 RGB display guide: JC8048W550 RGB 屏排障指南
            Klipper / Moonraker API notes: Klipper / Moonraker API 笔记
            LVGL v9 API notes: LVGL v9 API 笔记

nav:
  - Home: index.md
  - Screenshots: screenshots.md
  - Supported boards:
      - Overview: boards.md
      - ESP32 boards: boards/esp32.md
      - ESP32-S3 boards: boards/esp32s3.md
      - ESP32-C3 boards: boards/esp32c3.md
      - Linux client: boards/linux.md
      - Windows / macOS client: boards/desktop.md
      - Android client: boards/android.md
  - Porting to your own board: porting.md
  - Developer notes:
      - Architecture: architecture.md
      - Building from source: building.md
      - Display and encoder settings: display-settings.md
      - File-list issue 8 retest: issue-8-file-list.md
      - JC8048W550 RGB display guide: jc8048w550-rgb-display-guide.md
      - Klipper / Moonraker API notes: klipper-moonraker-api.md
      - LVGL v9 API notes: lvgl-v9-api-notes.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
